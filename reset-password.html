<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña | Núcleo — AVA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/nucleo.css">
<script src="https://unpkg.com/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
</head>
<body>

<main class="auth-shell">
  <svg class="auth-motif" viewBox="0 0 200 200" fill="none" aria-hidden="true">
    <path d="M20 20 L180 20 L100 90 Z" fill="#12E086" fill-opacity="0.5"/>
    <path d="M20 180 L180 180 L100 110 Z" fill="#12E086" fill-opacity="0.18"/>
  </svg>

  <div class="auth-card">
    <div class="auth-logo"><img src="/assets/logo/logo-icon-green.png" alt="AVA" width="240" height="240"></div>

    <div class="auth-view is-active" data-view="reset">
      <h1>Elegí tu nueva contraseña</h1>
      <p class="body-md">Esto reemplaza tu contraseña anterior. Usala para tu próximo inicio de sesión.</p>

      <form class="auth-form" id="reset-form">
        <p class="auth-error" id="reset-error" role="alert"></p>
        <p class="auth-success" id="reset-success" role="status">Listo, tu contraseña se actualizó. Ya podés iniciar sesión.</p>
        <div class="field">
          <label for="reset-password">Nueva contraseña</label>
          <input type="password" id="reset-password" required minlength="8" autocomplete="new-password" aria-describedby="reset-password-hint">
          <span class="field-hint" id="reset-password-hint">Mínimo 8 caracteres.</span>
        </div>
        <div class="field">
          <label for="reset-password-confirm">Repetir contraseña</label>
          <input type="password" id="reset-password-confirm" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-solid" style="width:100%; margin-top:6px;">Guardar nueva contraseña</button>
      </form>

      <div class="auth-links">
        <a href="/login.html">← Volver a iniciar sesión</a>
      </div>
    </div>
  </div>
</main>

<script src="/js/supabase-client.js"></script>
<script src="/js/reset-password.js"></script>
</body>
</html>
