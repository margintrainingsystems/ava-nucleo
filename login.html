<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión | Núcleo — AVA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/nucleo.css">
<script src="https://unpkg.com/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
</head>
<body>

<main class="auth-shell">
  <svg class="auth-motif" viewBox="0 0 200 200" fill="none" aria-hidden="true">
    <path d="M20 20 L180 20 L100 90 Z" fill="#12E086" fill-opacity="0.5"/>
    <path d="M20 180 L180 180 L100 110 Z" fill="#12E086" fill-opacity="0.18"/>
  </svg>

  <div class="auth-card">
    <div class="auth-logo"><img src="/assets/logo/logo-icon-green.png" alt="AVA" width="240" height="240"></div>

    <!-- Vista: login -->
    <div class="auth-view is-active" data-view="login">
      <h1>Núcleo</h1>
      <p class="body-md">El panel de AVA. Iniciá sesión para administrar el sitio.</p>

      <form class="auth-form" id="login-form">
        <p class="auth-error" id="login-error" role="alert"></p>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-solid" style="width:100%; margin-top:6px;">Iniciar sesión</button>
      </form>

      <div class="auth-links">
        <button type="button" data-show-view="forgot">¿Olvidaste tu contraseña?</button>
      </div>
    </div>

    <!-- Vista: olvidé mi contraseña -->
    <div class="auth-view" data-view="forgot">
      <h1>Recuperar acceso</h1>
      <p class="body-md">Te mandamos un link a tu email para elegir una contraseña nueva.</p>

      <form class="auth-form" id="forgot-form">
        <p class="auth-error" id="forgot-error" role="alert"></p>
        <p class="auth-success" id="forgot-success" role="status">Listo, revisá tu email. El link puede tardar unos minutos en llegar.</p>
        <div class="field">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" required autocomplete="username">
        </div>
        <button type="submit" class="btn btn-solid" style="width:100%; margin-top:6px;">Enviar link de recuperación</button>
      </form>

      <div class="auth-links">
        <button type="button" data-show-view="login">← Volver a iniciar sesión</button>
      </div>
    </div>

  </div>
</main>

<script src="/js/supabase-client.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
